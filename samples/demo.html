<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фильтры 3×3</title>
<style>
  body { margin: 0; background: #f3efe6; color: #1c1915; font: 17px/1.45 sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 28px; margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  figure { margin: 0; min-width: 0; background: white; padding: 10px; }
  img { width: 100%; height: auto; display: block; }
  figcaption { margin-top: 8px; }
  figcaption b { display: block; }
</style>
</head>
<body>
<main>
<h1>Фильтры 3×3</h1>
<div class="grid">
  <figure><img src="input.bmp" alt="исходный кадр"><figcaption><b>Исходный</b>один кадр</figcaption></figure>
  <figure><img src="blur.bmp" alt="размытие"><figcaption><b>Размытие</b>один поток, все строки</figcaption></figure>
  <figure><img src="sharpen.bmp" alt="резкость"><figcaption><b>Резкость</b>один поток</figcaption></figure>
  <figure><img src="gray.bmp" alt="серый"><figcaption><b>Серый</b>один поток</figcaption></figure>
  <figure><img src="blur_4.bmp" alt="размытие в 4 потока"><figcaption><b>Размытие, 4 потока</b>те же полосы строк, картинка как у одного потока</figcaption></figure>
</div>
</main>
</body>
</html>
